<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Gin Tonic</title>

<style>
/* Layout: una columna tipo fanzine risográfico; cartas "pegadas a mano" con leve giro, tinta rosa y azul sobre papel. */
:root{
  --paper:#f7f3ea; --panel:#fffdf7; --ink:#1b2a6b; --muted:#5a6596;
  --pink:#ff3fa4; --pink-deep:#d61f84; --pink-soft:#ffd6ea;
  --blue:#2f6fe4; --blue-soft:#cfe0ff; --tape:#f5d547;
  --ok:#1f9e6a; --bad:#d61f3f;
  --marker:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --type:"Special Elite","Courier New",Courier,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--type);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--marker);font-weight:400;font-size:2.5rem;line-height:1;margin:0;color:var(--pink);text-shadow:3px 3px 0 var(--blue)}
h2{font-family:var(--marker);font-weight:400;font-size:1.55rem;margin:0;line-height:1.1;text-wrap:balance;color:var(--ink)}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:lowercase;color:var(--pink-deep)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.status{font-size:.78rem;color:var(--blue);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:2px solid var(--blue);padding:2px 9px;transform:rotate(-2deg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel:nth-of-type(odd){transform:rotate(-.4deg)} .panel:nth-of-type(even){transform:rotate(.35deg)}
button,.btn{font-family:var(--marker);font-size:1.12rem;font-weight:400;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;-webkit-tap-highlight-color:transparent;transition:transform .08s,box-shadow .08s}
.btn-primary{background:var(--pink);color:var(--ink);box-shadow:4px 4px 0 var(--blue)}
.btn-primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--blue)}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn-spotify{background:var(--blue);color:#fff;font-size:1.3rem;width:100%;box-shadow:4px 4px 0 var(--pink)}
.btn-spotify:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.btn-small{min-height:38px;padding:5px 14px;font-size:.98rem}
.btn-danger{background:var(--bad);color:#fff}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
input,select{font-family:var(--type);font-size:16px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;min-height:50px;width:100%}
input::placeholder{color:#9aa2c4}
.code-input{font-family:var(--marker);font-size:2rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;color:var(--blue)}
.code{font-family:var(--marker);font-size:4.4rem;letter-spacing:.14em;line-height:1;color:var(--pink);text-shadow:4px 4px 0 var(--blue);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:5px 11px;font-size:.92rem;display:inline-flex;gap:8px;align-items:center}
.chip:nth-child(odd){transform:rotate(-1.5deg)} .chip:nth-child(even){transform:rotate(1.2deg)}
.chip.on{background:var(--pink);border-color:var(--ink)}
.chip.me{box-shadow:3px 3px 0 var(--blue)}
.chip .n{font-family:var(--marker);font-size:1.05rem;font-variant-numeric:tabular-nums}
.card{border:2px solid var(--ink);border-radius:3px;color:var(--ink);padding:9px 14px;display:grid;grid-template-columns:auto 1fr;gap:1px 14px;align-items:center;position:relative}
.timeline .card:nth-child(4n+1){transform:rotate(.9deg)} .timeline .card:nth-child(4n+3){transform:rotate(-1.1deg)}
.card .yr{font-family:var(--marker);font-size:2rem;line-height:1;grid-row:span 2;font-variant-numeric:tabular-nums}
.card .t{line-height:1.2;min-width:0;overflow-wrap:anywhere;font-weight:700}
.card .a{font-size:.86rem;min-width:0;overflow-wrap:anywhere}
.card.new::before{content:"";position:absolute;top:-10px;right:20px;width:58px;height:17px;background:var(--tape);opacity:.92;transform:rotate(-6deg)}
.big-card{border:3px solid var(--ink);border-radius:4px;color:var(--ink);padding:22px 20px;display:flex;flex-direction:column;gap:6px;text-align:center;transform:rotate(-1deg);position:relative}
.big-card::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-36px;width:72px;height:20px;background:var(--tape);opacity:.92;transform:rotate(3deg)}
.big-card .yr{font-family:var(--marker);font-size:5.4rem;line-height:.95;font-variant-numeric:tabular-nums}
.big-card .t{font-weight:700;font-size:1.25rem;line-height:1.2;overflow-wrap:anywhere}
.mystery{background:var(--blue);color:#fff;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;transform:rotate(1deg)}
.mystery .lab{background:var(--pink);color:var(--ink);border-radius:3px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mystery .lab b{font-family:var(--marker);font-weight:400;font-size:1.15rem}
.mystery .reels{display:flex;justify-content:center;align-items:center;gap:40px;padding:10px 0 4px}
.reel{width:40px;height:40px;border-radius:50%;border:6px solid #fff}
.mystery .q{font-family:var(--marker);font-size:2.6rem;line-height:1;color:var(--pink)}
.mystery .hint{font-size:.88rem;text-align:center;color:#eaf0ff}
@media (prefers-reduced-motion:no-preference){.reel{animation:spin 2.4s linear infinite;border-style:dashed}@keyframes spin{to{transform:rotate(360deg)}}}
.timeline{display:flex;flex-direction:column;gap:8px}
.slot{background:transparent;border:2px dashed var(--pink);color:var(--pink-deep);border-radius:3px;min-height:40px;font-family:var(--type);font-size:.88rem;width:100%;box-shadow:none}
.ghost-card{border:3px solid var(--pink);border-radius:3px;padding:9px 14px;display:flex;align-items:center;gap:14px;background:var(--pink-soft);color:var(--ink);font-family:var(--type);font-size:.95rem;box-shadow:3px 3px 0 var(--blue)}
.ghost-card .yr{font-family:var(--marker);font-size:2rem;color:var(--pink)}
.result{font-family:var(--marker);font-size:2.5rem;text-align:center;line-height:1}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--pink);padding-left:10px}
details summary{cursor:pointer;font-family:var(--marker);font-size:1.1rem;padding:2px 0}
.reveal-title{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:3px;background:var(--pink-soft);border:2px dashed var(--pink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:.92rem;max-width:calc(100% - 32px);z-index:20;text-align:center;box-shadow:3px 3px 0 var(--pink)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:.78rem;border:1.5px solid var(--ink);border-radius:3px;padding:1px 7px;font-variant-numeric:tabular-nums}
.score{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:6px 10px}
.srow.on{background:var(--pink)} .srow.me{box-shadow:3px 3px 0 var(--blue)}
.srow .sn{flex:1;min-width:0;overflow-wrap:anywhere}
.srow .n{font-family:var(--marker);font-size:1.15rem;font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
.tok{font-size:.8rem;letter-spacing:.06em;color:var(--blue);white-space:nowrap}
.srow.on .tok{color:var(--ink)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt.col{flex-direction:column;align-items:flex-start}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{min-height:38px;border-radius:0;padding:4px 12px;background:#fff;color:var(--ink);font-size:.98rem;box-shadow:none}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--blue);color:#fff}
.seg button:disabled,.tgl:disabled,.dchip:disabled{opacity:1;cursor:default}
.tgl{background:transparent;color:var(--ink);font-family:var(--type);font-size:.98rem;justify-content:flex-start;padding:4px 0;min-height:40px;box-shadow:none}
.tgl .box{width:24px;height:24px;border:2px solid var(--ink);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--marker);background:#fff}
.tgl.on .box{background:var(--pink)}
.dchip{min-height:36px;padding:3px 11px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font-family:var(--type);font-size:.9rem;box-shadow:none}
.dchip.on{background:var(--blue-soft)}
.teams{display:flex;flex-direction:column;gap:10px}
.team{border:2px dashed;border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tname{font-family:var(--marker);font-size:1.1rem;display:flex;align-items:center;gap:8px}
.chip .x{background:none;border:0;color:inherit;min-height:0;padding:0 2px;font-family:var(--type);font-size:1.1rem;box-shadow:none}
.mark{border-radius:3px;padding:8px 12px;font-size:.9rem;text-align:center}
.mark.placed{border:3px solid var(--pink);background:var(--pink-soft)}
.mark.stolen{border:3px solid var(--blue);background:var(--blue-soft)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .big-card,.result{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.9) rotate(-4deg);opacity:.4}to{opacity:1}}
}
</style>

const TEAM_NAMES=['Equipo Rosa','Equipo Azul','Equipo Amarillo','Equipo Verde'];
const TEAM_COLORS=['#ff3fa4','#2f6fe4','#f5d547','#3fbf8a'];
const DECADES={1950:['#ffe3f0','#2f6fe4'],1960:['#dbe8ff','#d61f84'],1970:['#ffc9e4','#2f6fe4'],1980:['#c3d7ff','#d61f84'],1990:['#ffb3d8','#1b2a6b'],2000:['#a9c6ff','#1b2a6b'],2010:['#ff8cc6','#1b2a6b'],2020:['#86adff','#1b2a6b']};
const DEC_FILTERS=[[1950,'50s-60s'],[1970,'70s'],[1980,'80s'],[1990,'90s'],[2000,'2000s'],[2010,'2010s'],[2020,'2020s']];
const decKey=y=>Math.max(1950,Math.min(2020,Math.floor(y/10)*10));
const decFilterKey=y=>{const d=decKey(y);return d===1960?1950:d};
const decColor=y=>DECADES[decKey(y)][0];
const decInk=y=>DECADES[decKey(y)][1];
const ES_ARTISTS=/Valens|Serrat|Nino Bravo|Mocedades|Rubén Blades|Nacha Pop|Kjarkas|Alaska|Grupo Niche|Hombres G|Soda Stereo|Mecano|Juan Luis Guerra|Maná|Prisioneros|Cadillacs|Enanitos|Ricky Martin|Shakira|Jarabe|Alejandro Sanz|Celia Cruz|Juanes|Las Ketchup|Chayanne|Aventura|Daddy Yankee|Bisbal|Wisin|Don Omar|Marc Anthony|Romeo Santos|Gente de Zona|Álvaro Soler|Carlos Vives|Luis Fonsi|J Balvin|Maluma|Rosalía|Nio García|Karol G|Bad Bunny|Manuel Turizo|Bizarrap|Eslabon|Santana/;
const EN_EXCEPTIONS=new Set(["Livin' la Vida Loca","Whenever, Wherever","Hips Don't Lie","Smooth","Bailamos","Hero"]);
const OTHER_LANG=new Set(['Ai se eu te pego','Dragostea din tei','Gangnam Style']);
function songLang(s){if(OTHER_LANG.has(s[0]))return 'otro';if(EN_EXCEPTIONS.has(s[0]))return 'en';if(s[0]==='Oye cómo va'||s[0]==='Corazón espinado')return 'es';if(ES_ARTISTS.test(s[1])&&!/Rob Thomas/.test(s[1]))return 'es';return 'en'}
const FAV=/Gracie Abrams|Olivia Rodrigo|Sienna Spiro|Sabrina Carpenter|Fleetwood Mac|Taylor Swift|Noah Kahan|One Direction/;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function spotifyUrl(i){const s=SONGS[i];return 'https://open.spotify.com/search/'+encodeURIComponent(s[0]+' '+s[1].split(/ ft\. | & /)[0])}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function newCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c}

const myId=lsGet('aa.pid')||(()=>{const v=rid();lsSet('aa.pid',v);return v})();
let myName=lsGet('aa.name')||'';
let role=null, code=null, peer=null, hostConn=null, guests=new Map();
let state=null, net='idle';

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}

/* ================= Mazo ================= */
function deckFor(st){
  return SONGS.map((s,i)=>i).filter(i=>{
    const s=SONGS[i];
    if(st.favOnly&&!FAV.test(s[1]))return false;
    if(st.lang!=='all'&&songLang(s)!==st.lang)return false;
    return st.decades.includes(decFilterKey(s[2]));
  });
}

/* ================= Reglas (solo las ejecuta el anfitrión) ================= */
function sortCards(c){return c.slice().sort((a,b)=>SONGS[a][2]-SONGS[b][2]||a-b)}
function fits(cards,k,y){const c=sortCards(cards);const lo=k===0?-Infinity:SONGS[c[k-1]][2], hi=k===c.length?Infinity:SONGS[c[k]][2];return lo<=y&&y<=hi}
function newGame(){return {code,hostId:myId,status:'lobby',players:[],seats:[],
  settings:{mode:'solo',teams:2,target:10,steal:true,tokens:true,lang:'all',decades:DEC_FILTERS.map(d=>d[0]),favOnly:false},
  turn:0,deck:[],current:null,phase:'listen',placed:null,steal:null,result:null,winner:null,rev:1}}
function seatOf(s,pid){const p=s.players.find(x=>x.id===pid);return p?s.seats.find(x=>x.id===p.seat):null}
function drawNext(s){
  if(!s.deck.length){s.status='finished';const max=Math.max(...s.seats.map(x=>x.cards.length));s.winner=s.seats.find(x=>x.cards.length===max).id;s.current=null;return}
  s.current=s.deck.pop();
}
function giveCard(s,seat,card){seat.cards=sortCards(seat.cards.concat(card));if(seat.cards.length>=s.settings.target&&!s.winner){s.status='finished';s.winner=seat.id}}
function reveal(s){
  const seat=s.seats[s.turn], y=SONGS[s.current][2];
  const correct=s.placed!=null&&fits(seat.cards,s.placed,y);
  let stoleBy=null;
  if(correct) giveCard(s,seat,s.current);
  else if(s.steal){const th=s.seats.find(x=>x.id===s.steal.seatId);if(th&&fits(seat.cards,s.steal.slot,y)){giveCard(s,th,s.current);stoleBy=th.id}}
  s.result={correct,slot:s.placed,seatId:seat.id,song:s.current,steal:s.steal,stoleBy,bonus:false,bought:false};
  s.phase='reveal';
}
function reduce(s,a,from){
  if(a.rev!=null&&a.rev!==s.rev) return null;
  const isHost=from===s.hostId, n=clone(s), st=n.settings;
  const mySeat=n.status==='lobby'?null:seatOf(n,from);
  const active=n.status==='playing'?n.seats[n.turn]:null;
  const isActive=!!(mySeat&&active&&mySeat.id===active.id);
  switch(a.type){
    case 'join':{
      const ex=n.players.find(p=>p.id===from);
      if(ex){if(ex.name===a.name)return null;ex.name=a.name;break}
      if(n.status!=='lobby'||n.players.length>=12)return null;
      n.players.push({id:from,name:a.name,team:n.players.length%st.teams,seat:null});break;
    }
    case 'kick':if(!isHost||n.status!=='lobby')return null;n.players=n.players.filter(p=>p.id!==a.id);break;
    case 'settings':{
      if(!isHost||n.status!=='lobby')return null;
      const v=a.patch||{};
      if(v.mode==='solo'||v.mode==='teams')st.mode=v.mode;
      if([2,3,4].includes(v.teams)){st.teams=v.teams;n.players.forEach((p,i)=>{if(p.team>=v.teams)p.team=i%v.teams})}
      if(TARGETS.includes(v.target))st.target=v.target;
      if(typeof v.steal==='boolean')st.steal=v.steal;
      if(typeof v.tokens==='boolean')st.tokens=v.tokens;
      if(['all','es','en'].includes(v.lang))st.lang=v.lang;
      if(typeof v.favOnly==='boolean')st.favOnly=v.favOnly;
      if(typeof v.decade==='number'){const i=st.decades.indexOf(v.decade);if(i>=0){if(st.decades.length===1)return null;st.decades.splice(i,1)}else st.decades.push(v.decade)}
      break;
    }
    case 'team':{if(n.status!=='lobby'||st.mode!=='teams')return null;const p=n.players.find(x=>x.id===(a.id&&isHost?a.id:from));if(!p||!(a.team>=0&&a.team<st.teams))return null;p.team=a.team;break}
    case 'start':{
      if(!isHost)return null;
      if(st.mode==='teams'){
        n.seats=[];for(let t=0;t<st.teams;t++){const m=n.players.filter(p=>p.team===t);if(m.length){const id='t'+t;n.seats.push({id,name:TEAM_NAMES[t],color:TEAM_COLORS[t],cards:[],tokens:st.tokens?START_TOKENS:0});m.forEach(p=>p.seat=id)}}
      }else{n.seats=n.players.map(p=>{p.seat='p'+p.id;return {id:'p'+p.id,name:p.name,color:null,cards:[],tokens:st.tokens?START_TOKENS:0}})}
      if(n.seats.length<2)return null;
      const deck=deckFor(st); if(deck.length<n.seats.length*(st.target+2))return null;
      n.deck=shuffle(deck); n.seats.forEach(x=>x.cards=[n.deck.pop()]); shuffle(n.seats);
      n.current=n.deck.pop();n.turn=0;n.phase='listen';n.placed=null;n.steal=null;n.result=null;n.winner=null;n.status='playing';break;
    }
    case 'place':{
      if(n.status!=='playing'||n.phase!=='listen')return null;
      if(!isActive&&!isHost)return null;
      const k=a.slot;if(!(k>=0&&k<=active.cards.length))return null;
      n.placed=k;n.steal=null;
      const thieves=st.steal&&n.seats.some(x=>x.id!==active.id&&(!st.tokens||x.tokens>=1));
      if(thieves)n.phase='steal';else reveal(n);
      break;
    }
    case 'steal':{
      if(n.status!=='playing'||n.phase!=='steal'||n.steal)return null;
      if(!mySeat||isActive)return null;
      if(st.tokens&&mySeat.tokens<1)return null;
      const k=a.slot;if(!(k>=0&&k<=active.cards.length)||k===n.placed)return null;
      if(st.tokens)mySeat.tokens--;
      n.steal={seatId:mySeat.id,slot:k,by:from};break;
    }
    case 'reveal':{if(n.status!=='playing'||n.phase!=='steal')return null;if(!isActive&&!isHost&&!(n.steal&&n.steal.by===from))return null;reveal(n);break}
    case 'bonus':{
      if(n.phase!=='reveal'||!n.result||n.result.bonus||!st.tokens)return null;
      const seat=n.seats.find(x=>x.id===n.result.seatId);if(!seat)return null;
      if(seat.tokens<MAX_TOKENS)seat.tokens++;n.result.bonus=true;break;
    }
    case 'buy':{
      if(n.status!=='playing'||n.phase!=='listen'||!st.tokens)return null;
      if(!isActive||active.tokens<BUY_COST)return null;
      active.tokens-=BUY_COST;giveCard(n,active,n.current);
      n.result={correct:true,bought:true,seatId:active.id,song:n.current,steal:null,stoleBy:null,bonus:true};n.phase='reveal';break;
    }
    case 'next':if(n.status!=='playing'||n.phase!=='reveal')return null;n.turn=(n.turn+1)%n.seats.length;n.phase='listen';n.placed=null;n.steal=null;n.result=null;drawNext(n);break;
    case 'skip':if(n.status!=='playing'||n.phase!=='listen')return null;drawNext(n);break;
    case 'rematch':if(!isHost)return null;n.status='lobby';n.seats=[];n.players.forEach(p=>p.seat=null);n.result=null;n.winner=null;n.deck=[];n.current=null;n.placed=null;n.steal=null;break;
    default:return null;
  }
  n.rev=s.rev+1;return n;
}
function hostApply(a,from){
  const n=reduce(state,a,from);
  if(!n){if(from===myId&&a.type==='start'){const st=state.settings;const d=deckFor(st).length;if(d<30)toast('Con esos filtros quedan '+d+' canciones. Abre más opciones.');else toast('Hacen falta al menos 2 jugadores o equipos con gente.')}return}
  if(n.turn!==state.turn||n.phase!==state.phase||n.current!==state.current){ui.slot=null;ui.showTitle=false;ui.stealing=false}
  state=n;lsSet('aa.hostState',JSON.stringify(state));broadcast();render();
}
function broadcast(){for(const g of guests.values()){try{g.conn.open&&g.conn.send({type:'state',state})}catch(e){}}}
function act(type,extra={}){
  const a={type,rev:state?state.rev:null,...extra};
  if(role==='host')hostApply(a,myId);
  else if(hostConn&&hostConn.open)hostConn.send({type:'action',action:a});
  else toast('Sin conexión con la sala, reconectando…');
}

/* ================= Red (PeerJS) ================= */
function createRoom(resume){
  role='host';net='connecting';
  if(resume&&resume.settings){state=resume;code=resume.code}else{code=newCode();state=newGame()}
  lsSet('aa.role','host');lsSet('aa.code',code);
  const j=state.players.find(p=>p.id===myId);if(!j)state.players.push({id:myId,name:myName,team:0,seat:null});else j.name=myName;
  lsSet('aa.hostState',JSON.stringify(state));render();openHostPeer(0);
}
function openHostPeer(tries){
  peer=new Peer(PREFIX+code,{debug:0});
  peer.on('open',()=>{net='online';render()});
  peer.on('connection',conn=>{
    conn.on('open',()=>{guests.set(conn.peer,{conn,playerId:null});conn.send({type:'state',state})});
    conn.on('data',msg=>{
      if(!msg||typeof msg!=='object')return;
      const g=guests.get(conn.peer);
      if(msg.type==='hello'&&typeof msg.playerId==='string'){
        g&&(g.playerId=msg.playerId);
        const name=String(msg.name||'').trim().slice(0,20)||'Jugador';
        const known=state.players.some(p=>p.id===msg.playerId);
        if(!known&&state.status!=='lobby'){conn.send({type:'denied',reason:'La partida ya empezó. Espera la revancha.'});return}
        hostApply({type:'join',name},msg.playerId);conn.send({type:'state',state});
      }else if(msg.type==='action'&&g&&g.playerId){hostApply(msg.action||{},g.playerId)}
    });
    conn.on('close',()=>{guests.delete(conn.peer);render()});
  });
  peer.on('disconnected',()=>{net='lost';render();setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){try{peer.destroy()}catch(e){}if(tries<8)setTimeout(()=>openHostPeer(tries+1),2500);else{net='lost';render();toast('Ese código está ocupado. Crea otra sala.')}}
    else if(['network','server-error','socket-error'].includes(err.type)){net='lost';render()}
  });
}
function joinRoom(c){
  c=c.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if(c.length!==4){toast('El código tiene 4 letras');return}
  role='guest';code=c;net='connecting';state=null;
  lsSet('aa.role','guest');lsSet('aa.code',code);render();
  if(!peer||peer.destroyed){peer=new Peer({debug:0});peer.on('open',connectToHost);peer.on('error',guestError);peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)})}
  else connectToHost();
}
function connectToHost(){
  if(role!=='guest')return;
  const conn=peer.connect(PREFIX+code,{reliable:true});hostConn=conn;
  conn.on('open',()=>{net='online';conn.send({type:'hello',playerId:myId,name:myName});render()});
  conn.on('data',msg=>{
    if(msg&&msg.type==='state'){const s=msg.state;if(state&&(s.turn!==state.turn||s.phase!==state.phase||s.current!==state.current)){ui.slot=null;ui.showTitle=false;ui.stealing=false}state=s;render()}
    else if(msg&&msg.type==='denied'){toast(msg.reason);leave()}
  });
  conn.on('close',()=>{if(role!=='guest')return;net='lost';render();setTimeout(()=>{if(role==='guest'&&(!hostConn||!hostConn.open))connectToHost()},3000)});
}
function guestError(err){
  if(role!=='guest')return;
  net='lost';render();
  if(err.type==='peer-unavailable'){if(!state)toast('No encontré la sala '+code+'. Revisa el código.');setTimeout(()=>{if(role==='guest'&&(!hostConn||!hostConn.open))connectToHost()},4000)}
}
function leave(){
  try{peer&&peer.destroy()}catch(e){}
  peer=null;hostConn=null;guests.clear();
  if(role==='host')lsDel('aa.hostState');
  role=null;state=null;code=null;net='idle';ui={...ui,slot:null,confirmLeave:false,stealing:false};
  lsDel('aa.role');lsDel('aa.code');history.replaceState(null,'',location.pathname);render();
}
function shareLink(){return location.origin+location.pathname+'?sala='+code}
async function share(){
  const url=shareLink();
  if(navigator.share){try{await navigator.share({title:'Gin Tonic',text:'Únete a la sala '+code,url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Enlace copiado')}catch(e){toast(url)}
}

/* ================= Vistas ================= */
function cardHtml(i,extra=''){const s=SONGS[i];return `<div class="card ${extra}" style="background:${decColor(s[2])}"><span class="yr" style="color:${decInk(s[2])}">${s[2]}</span><span class="t">${esc(s[0])}</span><span class="a">${esc(s[1])}</span></div>`}
function bigCard(i){const s=SONGS[i];return `<div class="big-card" style="background:${decColor(s[2])}"><span class="yr" style="color:${decInk(s[2])}">${s[2]}</span><span class="t">${esc(s[0])}</span><span class="a">${esc(s[1])}</span></div>`}
function slotLabel(cards,k){return k===0?(cards.length?`Antes de ${SONGS[cards[0]][2]}`:'Aquí'):k===cards.length?`Después de ${SONGS[cards[k-1]][2]}`:`Entre ${SONGS[cards[k-1]][2]} y ${SONGS[cards[k]][2]}`}
function timelineHtml(seat,{slots=false,highlight=null,marks={}}={}){
  const cards=sortCards(seat.cards);let h='<div class="timeline">';
  const slot=k=>{
    if(marks[k]) return `<div class="mark ${marks[k].cls}">${marks[k].text}</div>`;
    if(!slots) return '';
    if(ui.slot===k) return `<button class="ghost-card" data-act="slot" data-k="${k}" style="width:100%"><span class="yr">?</span><span>La canción va aquí</span></button>`;
    return `<button class="slot" data-act="slot" data-k="${k}">${slotLabel(cards,k)}</button>`};
  cards.forEach((c,k)=>{h+=slot(k);h+=cardHtml(c,c===highlight?'new':'')});
  h+=slot(cards.length);
  return h+'</div>';
}
function statusHtml(){
  if(!role)return '';
  const lbl={connecting:'Conectando…',online:'Sala '+code,lost:'Reconectando…',idle:''}[net];
  return `<span class="status"><span class="dot ${net==='online'?'on':net==='lost'?'off':''}"></span>${esc(lbl)}</span>`;
}
function tokensHtml(n){return state.settings.tokens?`<span class="tok" title="Fichas">${'●'.repeat(n)}${'○'.repeat(Math.max(0,MAX_TOKENS-n))}</span>`:''}
function seatLabel(seat){
  if(state.settings.mode!=='teams')return esc(seat.name);
  const m=state.players.filter(p=>p.seat===seat.id).map(p=>esc(p.name)).join(', ');
  return `${esc(seat.name)} <span class="small muted">(${m})</span>`;
}
function scoreboard(){
  return `<div class="score">${state.seats.map((x,i)=>{const mine=seatOf(state,myId);return `<div class="srow ${state.status==='playing'&&i===state.turn?'on':''} ${mine&&mine.id===x.id?'me':''}">${x.color?`<span class="sw" style="background:${x.color}"></span>`:''}<span class="sn">${seatLabel(x)}${mine&&mine.id===x.id?' · tú':''}</span>${tokensHtml(x.tokens)}<span class="n">${x.cards.length}/${state.settings.target}</span></div>`}).join('')}</div>`;
}
function legend(){return `<div class="legend">${Object.keys(DECADES).map(d=>`<span style="background:${DECADES[d][0]}">${String(d).slice(2)}s</span>`).join('')}</div>`}

  <div class="panel">
    <span class="eyebrow">unirme a una sala</span>
    <input id="joincode" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(ui.joinCode)}" aria-label="Código de sala">
    <button class="btn-primary" data-act="join">Entrar</button>
  </div>
  <div class="panel">
    <span class="eyebrow">o sé el anfitrión</span>
    <p class="muted small">Tu teléfono crea la sala y la mantiene. Déjalo con la página abierta durante la partida.</p>
    <button class="btn-ghost" data-act="create">Crear sala nueva</button>
    ${resume?`<button class="btn-ghost" data-act="resume">Retomar mi última sala</button>`:''}
  </div>`;
}
function seg(name,opts,cur,host){return `<div class="seg">${opts.map(([v,l])=>`<button class="${cur===v?'on':''}" ${host?`data-act="set" data-k="${name}" data-v="${v}"`:'disabled'}>${l}</button>`).join('')}</div>`}
function toggle(name,on,label,host){return `<button class="tgl ${on?'on':''}" ${host?`data-act="set" data-k="${name}" data-v="${!on}"`:'disabled'}><span class="box">${on?'✓':''}</span>${label}</button>`}
function vLobby(){
  const s=state, st=s.settings, host=role==='host', teams=st.mode==='teams';
  const deckN=deckFor(st).length;
  const me=s.players.find(p=>p.id===myId);
  const playersHtml=teams
    ?`<div class="teams">${Array.from({length:st.teams},(_,t)=>`<div class="team" style="border-color:${TEAM_COLORS[t]}"><div class="tname"><span class="sw" style="background:${TEAM_COLORS[t]}"></span>${TEAM_NAMES[t]}</div><div class="chips">${s.players.filter(p=>p.team===t).map(p=>`<span class="chip ${p.id===myId?'me':''}">${esc(p.name)}</span>`).join('')||'<span class="muted small">vacío</span>'}</div>${me&&me.team!==t?`<button class="btn-ghost btn-small" data-act="team" data-t="${t}">Unirme</button>`:''}</div>`).join('')}</div>`
    :`<div class="chips">${s.players.map(p=>`<span class="chip ${p.id===myId?'me':''}">${esc(p.name)}${p.id===s.hostId?' ★':''}${host&&p.id!==myId?` <button class="x" data-act="kick" data-id="${p.id}" aria-label="Quitar">×</button>`:''}</span>`).join('')}</div>`;
  return `
  <div class="panel" style="text-align:center">
    <span class="eyebrow">código de la sala</span>
    <div class="code">${esc(code)}</div>
    <button class="btn-primary" data-act="share">Invitar amigos</button>
    <p class="muted small">Tus amigos abren el enlace o entran a la página y escriben el código.</p>
  </div>
  <div class="panel">
    <span class="eyebrow">jugadores · ${s.players.length}</span>
    ${playersHtml}
  </div>
  <div class="panel">
    <span class="eyebrow">reglas${host?'':' · las elige el anfitrión'}</span>
    <div class="opt"><span>Cómo juegan</span>${seg('mode',[['solo','Cada uno'],['teams','Equipos']],st.mode,host)}</div>
    ${teams?`<div class="opt"><span>Equipos</span>${seg('teams',[[2,'2'],[3,'3'],[4,'4']],st.teams,host)}</div>`:''}
    <div class="opt"><span>Cartas para ganar</span>${seg('target',TARGETS.map(n=>[n,String(n)]),st.target,host)}</div>
    ${toggle('steal',st.steal,'Se pueden robar cartas',host)}
    ${toggle('tokens',st.tokens,'Fichas (empiezan con 2)',host)}
  </div>
  <div class="panel">
    <span class="eyebrow">mazo · ${deckN} canciones</span>
    <div class="opt"><span>Idioma</span>${seg('lang',[['all','Todas'],['es','Español'],['en','Inglés']],st.lang,host)}</div>
    <div class="opt col"><span>Décadas</span><div class="chips">${DEC_FILTERS.map(([d,l])=>`<button class="dchip ${st.decades.includes(d)?'on':''}" ${host?`data-act="set" data-k="decade" data-v="${d}"`:'disabled'}>${l}</button>`).join('')}</div></div>
    ${toggle('favOnly',st.favOnly,'Solo nuestros artistas',host)}
    ${deckN<30?'<p class="note">Con estos filtros quedan pocas canciones. Abre más opciones.</p>':''}
  </div>
  ${host?`<button class="btn-primary" data-act="start" ${s.players.length<2?'disabled':''}>${s.players.length<2?'Esperando jugadores…':'Empezar partida'}</button>`:'<p class="muted" style="text-align:center">Esperando a que el anfitrión empiece…</p>'}
  ${rulesBox()}
  ${leaveBox()}`;
}
function rulesBox(){
  const st=state.settings;
  return `<details class="panel"><summary>Cómo se juega</summary><div class="stack small">
    <p>1. En tu turno, alguien pone la canción en Spotify. Tú no ves el título: escuchas y eliges en qué lugar de tu línea va.</p>
    <p>2. Si el año cae entre las cartas que elegiste, te la quedas. Si es el mismo año que una vecina, también vale.</p>
    ${st.steal?`<p>3. Antes de revelar, los demás ven dónde la pusiste. Si creen que va en otro lugar, pueden robar${st.tokens?' (cuesta 1 ficha)':''}: el primero que marque otro hueco se la queda si acierta y tú fallas.</p>`:''}
    ${st.tokens?`<p>Fichas: si dices el título y el artista antes de revelar, ganas una ficha. Con ${BUY_COST} fichas puedes comprar la carta sin adivinar. Máximo ${MAX_TOKENS}.</p>`:''}
    <p>Gana quien llegue primero a ${st.target} cartas.</p></div></details>`;
}
function vPlaying(){
  const s=state, st=s.settings, act_=s.seats[s.turn], mySeat=seatOf(s,myId), mine=!!(mySeat&&mySeat.id===act_.id), host=role==='host';
  const who=st.mode==='teams'?esc(act_.name):esc(act_.name);
  let main='';
  if(s.phase==='listen'){
    if(mine){
      main=`<div class="panel">
        <div class="mystery"><div class="lab"><b>${st.mode==='teams'?'le toca a tu equipo':'te toca a ti'}</b><span class="small">lado A · 60 min</span></div><div class="reels"><span class="reel"></span><span class="q">?</span><span class="reel"></span></div><p class="hint">Alguien está poniendo la canción. Escuchen y elijan dónde va.</p></div>
        <h2>¿Dónde va en tu línea?</h2>
        ${timelineHtml(act_,{slots:true})}
        <button class="btn-primary" data-act="place" ${ui.slot===null?'disabled':''}>${ui.slot===null?'Toca un hueco':'La pongo aquí'}</button>
        ${st.tokens?`<button class="btn-ghost btn-small" data-act="buy" ${act_.tokens<BUY_COST?'disabled':''}>Comprar la carta (${BUY_COST} fichas)</button>`:''}
      </div>`;
    }else{
      const dj=s.seats[(s.turn+1)%s.seats.length];
      main=`<div class="panel">
        <span class="eyebrow">turno de ${who}</span>
        <h2>${mySeat&&dj.id===mySeat.id?'Te toca poner la canción':`Pone la canción: ${esc(dj.name)}`}</h2>
        <a class="btn btn-spotify" href="${spotifyUrl(s.current)}" target="_blank" rel="noopener">Abrir en Spotify</a>
        ${ui.showTitle?`<div class="reveal-title"><strong>${esc(SONGS[s.current][0])}</strong><span class="muted">${esc(SONGS[s.current][1])}</span></div>`:''}
        <div class="row"><button class="btn-ghost btn-small" data-act="title">${ui.showTitle?'Ocultar título':'Ver título'}</button><button class="btn-ghost btn-small" data-act="skip">Saltar canción</button></div>
        <p class="muted small">Que ${who} no vea tu pantalla.</p>
      </div>
      ${host?`<details class="panel"><summary>Colocar por ${who} (si se desconectó)</summary>${timelineHtml(act_,{slots:true})}<button class="btn-primary" data-act="place" ${ui.slot===null?'disabled':''}>Confirmar por ${who}</button></details>`:''}
      ${mySeat?`<div class="panel"><span class="eyebrow">tu línea · ${mySeat.cards.length}/${st.target}</span>${timelineHtml(mySeat)}</div>`:''}`;
    }
  }else if(s.phase==='steal'){
    const placedMark={[s.placed]:{cls:'placed',text:`${who} la puso aquí`}};
    if(s.steal){placedMark[s.steal.slot]={cls:'stolen',text:`${esc((s.seats.find(x=>x.id===s.steal.seatId)||{}).name||'')} dice que va aquí`}}
    const canSteal=mySeat&&!mine&&!s.steal&&(!st.tokens||mySeat.tokens>=1);
    const canReveal=mine||host||(s.steal&&s.steal.by===myId);
    if(ui.stealing&&canSteal){
      const cards=sortCards(act_.cards);
      main=`<div class="panel">
        <span class="eyebrow">robar${st.tokens?' · cuesta 1 ficha':''}</span>
        <h2>¿Dónde crees que va?</h2>
        <div class="timeline">${cards.map((c,k)=>(k===s.placed?`<div class="mark placed">${who} la puso aquí</div>`:(ui.slot===k?`<button class="ghost-card" data-act="slot" data-k="${k}" style="width:100%"><span class="yr">?</span><span>Aquí la robo</span></button>`:`<button class="slot" data-act="slot" data-k="${k}">${slotLabel(cards,k)}</button>`))+cardHtml(c)).join('')}${cards.length===s.placed?`<div class="mark placed">${who} la puso aquí</div>`:(ui.slot===cards.length?`<button class="ghost-card" data-act="slot" data-k="${cards.length}" style="width:100%"><span class="yr">?</span><span>Aquí la robo</span></button>`:`<button class="slot" data-act="slot" data-k="${cards.length}">${slotLabel(cards,cards.length)}</button>`)}</div>
        <button class="btn-primary" data-act="steal" ${ui.slot===null?'disabled':''}>¡Robo!</button>
        <button class="btn-ghost btn-small" data-act="unsteal">Mejor no</button>
      </div>`;
    }else{
      main=`<div class="panel">
        <span class="eyebrow">antes de revelar</span>
        <h2>${s.steal?'¡Intentaron robar!':mine?'¿Alguien te la quiere robar?':`${who} ya la colocó`}</h2>
        ${timelineHtml(act_,{marks:placedMark})}
        ${canSteal?`<button class="btn-primary" data-act="stealmode">Robar${st.tokens?' (1 ficha)':''}</button>`:''}
        ${canReveal?`<button class="${canSteal?'btn-ghost':'btn-primary'}" data-act="reveal">Revelar el año</button>`:'<p class="muted small" style="text-align:center">Esperando a que revelen…</p>'}
        ${!s.steal&&!mine?'<p class="muted small">Si nadie quiere robar, revelen.</p>':''}
      </div>`;
    }
  }else{
    const r=s.result, rs=s.seats.find(x=>x.id===r.seatId)||act_, thief=r.stoleBy?s.seats.find(x=>x.id===r.stoleBy):null;
    const rsName=mySeat&&mySeat.id===rs.id?(st.mode==='teams'?'Tu equipo':'Tú'):esc(rs.name);
    let head,cls,line;
    if(r.bought){head='Carta comprada';cls='ok';line=`${rsName} usó ${BUY_COST} fichas.`}
    else if(r.correct){head='¡Correcto!';cls='ok';line=`${rsName} se queda la carta.`}
    else if(thief){head='¡Robada!';cls='bad';line=`${esc(thief.name)} se lleva la carta.`}
    else{head='No era ahí';cls='bad';line=r.steal?'Nadie acertó. La carta se descarta.':'La carta se descarta.'}
    const owner=r.correct||r.bought?rs:thief;
    main=`<div class="panel">
      <div class="result ${cls}">${head}</div>
      ${bigCard(r.song)}
      <p style="text-align:center">${line}</p>
      ${st.tokens&&!r.bought?(r.bonus?`<p class="muted small" style="text-align:center">+1 ficha por adivinar título y artista</p>`:`<button class="btn-ghost btn-small" data-act="bonus">${rsName} dijo título y artista: +1 ficha</button>`):''}
      <button class="btn-primary" data-act="next">Siguiente turno</button>
      <a class="btn btn-ghost" href="${spotifyUrl(r.song)}" target="_blank" rel="noopener">Escucharla otra vez</a>
    </div>
    ${owner?`<div class="panel"><span class="eyebrow">línea de ${esc(owner.name)}</span>${timelineHtml(owner,{highlight:r.song})}</div>`:''}`;
  }
  return `${scoreboard()}${main}${allLines()}${rulesBox()}${leaveBox()}`;
}
function vFinished(){
  const w=state.seats.find(x=>x.id===state.winner), mySeat=seatOf(state,myId);
  return `<div class="panel" style="text-align:center">
    <span class="eyebrow">fin de la partida</span>
    <h2 style="font-size:2.6rem">${w&&mySeat&&w.id===mySeat.id?'¡Ganaste!':'Gana '+esc(w?w.name:'—')}</h2>
    ${state.result?bigCard(state.result.song):'<p class="muted">Se acabó el mazo.</p>'}
    ${role==='host'?`<button class="btn-primary" data-act="rematch">Revancha</button>`:'<p class="muted">El anfitrión puede empezar la revancha.</p>'}
  </div>${scoreboard()}${allLines(true)}${leaveBox()}`;
}
function allLines(open=false){
  return `<details class="panel" ${open?'open':''}><summary>Ver las líneas de todos</summary>${state.seats.map(x=>`<div class="stack" style="margin-top:10px"><span class="eyebrow">${esc(x.name)} · ${x.cards.length}</span>${x.cards.length?timelineHtml(x):'<span class="muted small">Sin cartas</span>'}</div>`).join('')}</details>`;
}
function leaveBox(){
  const warn=role==='host'?'Si sales, la sala se cierra para todos.':'Puedes volver a entrar con el mismo código.';
  return ui.confirmLeave
    ?`<div class="panel"><p>${warn}</p><div class="row"><button class="btn-danger btn-small" data-act="leave-yes">Salir</button><button class="btn-ghost btn-small" data-act="leave-no">Cancelar</button></div></div>`
    :`<div><button class="btn-ghost btn-small" data-act="leave">Salir de la sala</button></div>`;
}
function vWaiting(){
  return `<div class="panel"><span class="eyebrow">sala ${esc(code)}</span><h2>${net==='lost'?'Buscando la sala…':'Conectando…'}</h2><p class="muted">Asegúrate de que el anfitrión tenga la página abierta. Si tarda mucho, prueben todos con el mismo wifi.</p></div>${leaveBox()}`;
}
function render(){
  const app=document.getElementById('app');
  const ae=document.activeElement, fid=ae&&ae.id, sel=ae&&ae.selectionStart;
  const nameVal=document.getElementById('name')?.value;if(nameVal!=null)myName=nameVal;
  const jc=document.getElementById('joincode')?.value;if(jc!=null)ui.joinCode=jc;
  const open=[...document.querySelectorAll('details[data-key]')].filter(d=>d.open).map(d=>d.dataset.key);
  let body;
  if(!role)body=vHome();
  else if(!state)body=vWaiting();
  else if(state.status==='lobby')body=vLobby();
  else if(state.status==='playing')body=vPlaying();
  else body=vFinished();
  app.innerHTML=`<header><h1>Gin Tonic</h1>${statusHtml()}</header>${body}`;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'){const k=e.target.querySelector('summary')?.textContent;if(k){openDetails[k]=e.target.open}}},true);
const openDetails={};
const _render=render;
render=function(){_render();document.querySelectorAll('details').forEach(d=>{const k=d.querySelector('summary')?.textContent;if(k&&openDetails[k]!==undefined)d.open=openDetails[k]})};

function needName(){
  const v=(document.getElementById('name')?.value||myName).trim().slice(0,20);
  if(!v){toast('Escribe tu nombre primero');document.getElementById('name')?.focus();return false}
  myName=v;lsSet('aa.name',v);return true;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='create'){if(needName())createRoom()}
  else if(a==='resume'){if(needName()){try{createRoom(JSON.parse(lsGet('aa.hostState')))}catch(err){createRoom()}}}
  else if(a==='join'){if(needName())joinRoom(document.getElementById('joincode').value)}
  else if(a==='share')share();
  else if(a==='kick')act('kick',{id:b.dataset.id});
  else if(a==='team')act('team',{team:+b.dataset.t});
  else if(a==='set'){
    const k=b.dataset.k,v=b.dataset.v;let patch={};
    if(k==='decade')patch.decade=+v;
    else if(k==='teams'||k==='target')patch[k]=+v;
    else if(v==='true'||v==='false')patch[k]=v==='true';
    else patch[k]=v;
    act('settings',{patch});
  }
  else if(a==='start')act('start');
  else if(a==='slot'){const k=+b.dataset.k;ui.slot=ui.slot===k?null:k;render()}
  else if(a==='place'&&ui.slot!==null)act('place',{slot:ui.slot});
  else if(a==='stealmode'){ui.stealing=true;ui.slot=null;render()}
  else if(a==='unsteal'){ui.stealing=false;ui.slot=null;render()}
  else if(a==='steal'&&ui.slot!==null){act('steal',{slot:ui.slot});ui.stealing=false;ui.slot=null}
  else if(a==='reveal')act('reveal');
  else if(a==='bonus')act('bonus');
  else if(a==='buy')act('buy');
  else if(a==='title'){ui.showTitle=!ui.showTitle;render()}
  else if(a==='skip'){act('skip');toast('Canción cambiada')}
  else if(a==='next')act('next');
  else if(a==='rematch')act('rematch');
  else if(a==='leave'){ui.confirmLeave=true;render()}
  else if(a==='leave-no'){ui.confirmLeave=false;render()}
  else if(a==='leave-yes')leave();
});
document.addEventListener('input',e=>{if(e.target.id==='joincode'){const v=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);if(v!==e.target.value)e.target.value=v}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='joincode'){e.preventDefault();if(needName())joinRoom(e.target.value)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&role==='guest'&&(!hostConn||!hostConn.open)&&peer&&!peer.destroyed){if(peer.disconnected){try{peer.reconnect()}catch(e){}}else connectToHost()}});

(function boot(){
  if(typeof Peer==='undefined'){document.getElementById('app').innerHTML='<div class="panel"><h2>No se pudo cargar</h2><p class="muted">Revisa tu conexión a internet y recarga la página.</p></div>';return}
  const q=new URLSearchParams(location.search).get('sala');
  const savedRole=lsGet('aa.role'),savedCode=lsGet('aa.code');
  if(q)ui.joinCode=q.toUpperCase().slice(0,4);
  if(savedRole==='host'&&lsGet('aa.hostState')&&myName&&(!q||q.toUpperCase()===savedCode)){try{const s=JSON.parse(lsGet('aa.hostState'));if(s.settings){createRoom(s);return}}catch(e){}}
  if(savedRole==='guest'&&savedCode&&myName&&(!q||q.toUpperCase()===savedCode)){joinRoom(savedCode);return}
  render();
})();
</script>
</body>
</html>
