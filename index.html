<style>
/* Layout: una columna tipo fanzine risográfico; cartas "pegadas a mano" con leve giro, tinta rosa y azul sobre papel. */
:root{
  --paper:#f7f3ea; --panel:#fffdf7; --ink:#1b2a6b; --muted:#5a6596;
  --pink:#ff3fa4; --pink-deep:#d61f84; --pink-soft:#ffd6ea;
  --blue:#2f6fe4; --blue-soft:#cfe0ff; --tape:#f5d547;
  --ok:#1f9e6a; --bad:#d61f3f;
  --marker:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --type:"Special Elite","Courier New",Courier,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--type);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--marker);font-weight:400;font-size:2.5rem;line-height:1;margin:0;color:var(--pink);text-shadow:3px 3px 0 var(--blue)}
h2{font-family:var(--marker);font-weight:400;font-size:1.55rem;margin:0;line-height:1.1;text-wrap:balance;color:var(--ink)}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:lowercase;color:var(--pink-deep)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.status{font-size:.78rem;color:var(--blue);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:2px solid var(--blue);padding:2px 9px;transform:rotate(-2deg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel:nth-of-type(odd){transform:rotate(-.4deg)} .panel:nth-of-type(even){transform:rotate(.35deg)}
button,.btn{font-family:var(--marker);font-size:1.12rem;font-weight:400;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;-webkit-tap-highlight-color:transparent;transition:transform .08s,box-shadow .08s}
.btn-primary{background:var(--pink);color:var(--ink);box-shadow:4px 4px 0 var(--blue)}
.btn-primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--blue)}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn-spotify{background:var(--blue);color:#fff;font-size:1.3rem;width:100%;box-shadow:4px 4px 0 var(--pink)}
.btn-spotify:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.btn-small{min-height:38px;padding:5px 14px;font-size:.98rem}
.btn-danger{background:var(--bad);color:#fff}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
input,select{font-family:var(--type);font-size:16px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;min-height:50px;width:100%}
input::placeholder{color:#9aa2c4}
.code-input{font-family:var(--marker);font-size:2rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;color:var(--blue)}
.code{font-family:var(--marker);font-size:4.4rem;letter-spacing:.14em;line-height:1;color:var(--pink);text-shadow:4px 4px 0 var(--blue);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--ink);border-radius:4px;padding:5px 11px;font-size:.92rem;display:inline-flex;gap:8px;align-items:center}
.chip:nth-child(odd){transform:rotate(-1.5deg)} .chip:nth-child(even){transform:rotate(1.2deg)}
.chip.on{background:var(--pink);border-color:var(--ink)}
.chip.me{box-shadow:3px 3px 0 var(--blue)}
.chip .n{font-family:var(--marker);font-size:1.05rem;font-variant-numeric:tabular-nums}
.card{border:2px solid var(--ink);border-radius:3px;color:var(--ink);padding:9px 14px;display:grid;grid-template-columns:auto 1fr;gap:1px 14px;align-items:center;position:relative}
.timeline .card:nth-child(4n+1){transform:rotate(.9deg)} .timeline .card:nth-child(4n+3){transform:rotate(-1.1deg)}
.card .yr{font-family:var(--marker);font-size:2rem;line-height:1;grid-row:span 2;font-variant-numeric:tabular-nums}
.card .t{line-height:1.2;min-width:0;overflow-wrap:anywhere;font-weight:700}
.card .a{font-size:.86rem;min-width:0;overflow-wrap:anywhere}
.card.new::before{content:"";position:absolute;top:-10px;right:20px;width:58px;height:17px;background:var(--tape);opacity:.92;transform:rotate(-6deg)}
.big-card{border:3px solid var(--ink);border-radius:4px;color:var(--ink);padding:22px 20px;display:flex;flex-direction:column;gap:6px;text-align:center;transform:rotate(-1deg);position:relative}
.big-card::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-36px;width:72px;height:20px;background:var(--tape);opacity:.92;transform:rotate(3deg)}
.big-card .yr{font-family:var(--marker);font-size:5.4rem;line-height:.95;font-variant-numeric:tabular-nums}
.big-card .t{font-weight:700;font-size:1.25rem;line-height:1.2;overflow-wrap:anywhere}
.mystery{background:var(--blue);color:#fff;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;transform:rotate(1deg)}
.mystery .lab{background:var(--pink);color:var(--ink);border-radius:3px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mystery .lab b{font-family:var(--marker);font-weight:400;font-size:1.15rem}
.mystery .reels{display:flex;justify-content:center;align-items:center;gap:40px;padding:10px 0 4px}
.reel{width:40px;height:40px;border-radius:50%;border:6px solid #fff}
.mystery .q{font-family:var(--marker);font-size:2.6rem;line-height:1;color:var(--pink)}
.mystery .hint{font-size:.88rem;text-align:center;color:#eaf0ff}
@media (prefers-reduced-motion:no-preference){.reel{animation:spin 2.4s linear infinite;border-style:dashed}@keyframes spin{to{transform:rotate(360deg)}}}
.timeline{display:flex;flex-direction:column;gap:8px}
.slot{background:transparent;border:2px dashed var(--pink);color:var(--pink-deep);border-radius:3px;min-height:40px;font-family:var(--type);font-size:.88rem;width:100%;box-shadow:none}
.ghost-card{border:3px solid var(--pink);border-radius:3px;padding:9px 14px;display:flex;align-items:center;gap:14px;background:var(--pink-soft);color:var(--ink);font-family:var(--type);font-size:.95rem;box-shadow:3px 3px 0 var(--blue)}
.ghost-card .yr{font-family:var(--marker);font-size:2rem;color:var(--pink)}
.result{font-family:var(--marker);font-size:2.5rem;text-align:center;line-height:1}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--pink);padding-left:10px}
details summary{cursor:pointer;font-family:var(--marker);font-size:1.1rem;padding:2px 0}
.reveal-title{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:3px;background:var(--pink-soft);border:2px dashed var(--pink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:.92rem;max-width:calc(100% - 32px);z-index:20;text-align:center;box-shadow:3px 3px 0 var(--pink)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:.78rem;border:1.5px solid var(--ink);border-radius:3px;padding:1px 7px;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .big-card,.result{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.9) rotate(-4deg);opacity:.4}to{opacity:1}}
}
</style>
</head>

const DECADES={1950:['#ffe3f0','#2f6fe4'],1960:['#dbe8ff','#d61f84'],1970:['#ffc9e4','#2f6fe4'],1980:['#c3d7ff','#d61f84'],1990:['#ffb3d8','#1b2a6b'],2000:['#a9c6ff','#1b2a6b'],2010:['#ff8cc6','#1b2a6b'],2020:['#86adff','#1b2a6b']};
const decKey=y=>Math.max(1950,Math.min(2020,Math.floor(y/10)*10));
const decColor=y=>DECADES[decKey(y)][0];
const decInk=y=>DECADES[decKey(y)][1];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function spotifyUrl(i){const s=SONGS[i];return 'https://open.spotify.com/search/'+encodeURIComponent(s[0]+' '+s[1].split(/ ft\. | & /)[0])}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function newCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c}

const myId=lsGet('aa.pid')||(()=>{const v=rid();lsSet('aa.pid',v);return v})();
let myName=lsGet('aa.name')||'';
let role=null;            // 'host' | 'guest'
let code=null;
let peer=null, hostConn=null, guests=new Map(); // host: peerId -> {conn, playerId}
let state=null;           // authoritative on host, mirror on guests
let net='idle';           // idle|connecting|online|lost
let ui={slot:null,showTitle:false,confirmLeave:false,view:'home',tab:'mine',joinCode:''};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}

/* ================= Reglas del juego (solo las ejecuta el anfitrión) ================= */
function sortCards(c){return c.slice().sort((a,b)=>SONGS[a][2]-SONGS[b][2]||a-b)}
function newGame(){return {code,hostId:myId,status:'lobby',players:[],target:10,turn:0,deck:[],current:null,phase:'listen',result:null,winner:null,rev:1}}
function drawNext(s){
  if(!s.deck.length){s.status='finished';const max=Math.max(...s.players.map(p=>p.cards.length));s.winner=s.players.find(p=>p.cards.length===max).id;return}
  s.current=s.deck.pop();
}
function reduce(s,a,from){
  // a.rev protege contra toques dobles o mensajes viejos
  if(a.rev!=null&&a.rev!==s.rev) return null;
  const isHost=from===s.hostId;
  const n=clone(s);
  switch(a.type){
    case 'join':{
      const ex=n.players.find(p=>p.id===from);
      if(ex){ if(ex.name===a.name) return null; ex.name=a.name; break }
      if(n.status!=='lobby') return null;
      if(n.players.length>=12) return null;
      n.players.push({id:from,name:a.name,cards:[]}); break;
    }
    case 'kick': if(!isHost||n.status!=='lobby') return null; n.players=n.players.filter(p=>p.id!==a.id); break;
    case 'target': if(!isHost||n.status!=='lobby') return null; n.target=a.n; break;
    case 'start':
      if(!isHost||n.players.length<2) return null;
      n.deck=shuffle(SONGS.map((_,i)=>i));
      n.players.forEach(p=>p.cards=[n.deck.pop()]);
      shuffle(n.players);
      n.current=n.deck.pop(); n.turn=0; n.phase='listen'; n.result=null; n.winner=null; n.status='playing'; break;
    case 'place':{
      if(n.status!=='playing'||n.phase!=='listen') return null;
      const p=n.players[n.turn]; if(from!==p.id&&!isHost) return null;
      const cards=sortCards(p.cards), y=SONGS[n.current][2], k=a.slot;
      if(!(k>=0&&k<=cards.length)) return null;
      const lo=k===0?-Infinity:SONGS[cards[k-1]][2], hi=k===cards.length?Infinity:SONGS[cards[k]][2];
      const correct=lo<=y&&y<=hi;
      if(correct) p.cards=sortCards(cards.concat(n.current));
      n.result={correct,slot:k,playerId:p.id,song:n.current};
      n.phase='reveal';
      if(correct&&p.cards.length>=n.target){n.status='finished';n.winner=p.id}
      break;
    }
    case 'next': if(n.status!=='playing'||n.phase!=='reveal') return null; n.turn=(n.turn+1)%n.players.length; n.phase='listen'; n.result=null; drawNext(n); break;
    case 'skip': if(n.status!=='playing'||n.phase!=='listen') return null; drawNext(n); break;
    case 'rematch': if(!isHost) return null; n.status='lobby'; n.players.forEach(p=>p.cards=[]); n.result=null; n.winner=null; n.deck=[]; n.current=null; break;
    default: return null;
  }
  n.rev=s.rev+1; return n;
}
function hostApply(a,from){
  const n=reduce(state,a,from); if(!n) return;
  if(n.turn!==state.turn||n.phase!==state.phase||n.current!==state.current){ui.slot=null;ui.showTitle=false}
  state=n; lsSet('aa.hostState',JSON.stringify(state)); broadcast(); render();
}
function broadcast(){for(const g of guests.values()){try{g.conn.open&&g.conn.send({type:'state',state})}catch(e){}}}
function act(type,extra={}){
  const a={type,rev:state?state.rev:null,...extra};
  if(role==='host') hostApply(a,myId);
  else if(hostConn&&hostConn.open) hostConn.send({type:'action',action:a});
  else toast('Sin conexión con la sala, reconectando…');
}

/* ================= Red (PeerJS) ================= */
function createRoom(resume){
  role='host'; net='connecting'; ui.view='room';
  if(resume){state=resume;code=resume.code}else{code=newCode();state=newGame();}
  lsSet('aa.role','host'); lsSet('aa.code',code);
  const j=state.players.find(p=>p.id===myId); if(!j) state.players.push({id:myId,name:myName,cards:[]}); else j.name=myName;
  lsSet('aa.hostState',JSON.stringify(state));
  render();
  openHostPeer(0);
}
function openHostPeer(tries){
  peer=new Peer(PREFIX+code,{debug:0});
  peer.on('open',()=>{net='online';render()});
  peer.on('connection',conn=>{
    conn.on('open',()=>{guests.set(conn.peer,{conn,playerId:null});conn.send({type:'state',state})});
    conn.on('data',msg=>{
      if(!msg||typeof msg!=='object') return;
      const g=guests.get(conn.peer);
      if(msg.type==='hello'&&typeof msg.playerId==='string'){
        g&&(g.playerId=msg.playerId);
        const name=String(msg.name||'').trim().slice(0,20)||'Jugador';
        const known=state.players.some(p=>p.id===msg.playerId);
        if(!known&&state.status!=='lobby'){conn.send({type:'denied',reason:'La partida ya empezó. Espera la revancha.'});return}
        hostApply({type:'join',name},msg.playerId);
        conn.send({type:'state',state});
      }else if(msg.type==='action'&&g&&g.playerId){hostApply(msg.action||{},g.playerId)}
    });
    conn.on('close',()=>{guests.delete(conn.peer);render()});
  });
  peer.on('disconnected',()=>{net='lost';render();setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){
      // El código sigue reservado (p. ej. recargaste la página): reintenta unos segundos
      try{peer.destroy()}catch(e){}
      if(tries<8){setTimeout(()=>openHostPeer(tries+1),2500)}else{net='lost';render();toast('Ese código está ocupado. Crea otra sala.')}
    }else if(err.type==='network'||err.type==='server-error'||err.type==='socket-error'){net='lost';render()}
  });
}
function joinRoom(c){
  c=c.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if(c.length!==4){toast('El código tiene 4 letras');return}
  role='guest'; code=c; net='connecting'; ui.view='room'; state=null;
  lsSet('aa.role','guest'); lsSet('aa.code',code);
  render();
  if(!peer||peer.destroyed){peer=new Peer({debug:0});peer.on('open',connectToHost);peer.on('error',guestError);peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)})}
  else connectToHost();
}
function connectToHost(){
  if(role!=='guest') return;
  const conn=peer.connect(PREFIX+code,{reliable:true});
  hostConn=conn;
  conn.on('open',()=>{net='online';conn.send({type:'hello',playerId:myId,name:myName});render()});
  conn.on('data',msg=>{
    if(msg&&msg.type==='state'){
      const s=msg.state;
      if(state&&(s.turn!==state.turn||s.phase!==state.phase||s.current!==state.current)){ui.slot=null;ui.showTitle=false}
      state=s; render();
    }else if(msg&&msg.type==='denied'){toast(msg.reason);leave()}
  });
  conn.on('close',()=>{if(role!=='guest')return;net='lost';render();setTimeout(()=>{if(role==='guest'&&(!hostConn||!hostConn.open))connectToHost()},3000)});
}
function guestError(err){
  if(role!=='guest') return;
  if(err.type==='peer-unavailable'){
    net='lost';render();
    if(!state){toast('No encontré la sala '+code+'. Revisa el código.');}
    setTimeout(()=>{if(role==='guest'&&(!hostConn||!hostConn.open))connectToHost()},4000);
  }else{net='lost';render()}
}
function leave(){
  try{peer&&peer.destroy()}catch(e){}
  peer=null;hostConn=null;guests.clear();
  if(role==='host')lsDel('aa.hostState');
  role=null;state=null;code=null;net='idle';ui={...ui,view:'home',slot:null,confirmLeave:false};
  lsDel('aa.role');lsDel('aa.code');
  history.replaceState(null,'',location.pathname);
  render();
}
function shareLink(){return location.origin+location.pathname+'?sala='+code}
async function share(){
  const url=shareLink();
  if(navigator.share){try{await navigator.share({title:'Gin Tonic',text:'Únete a la sala '+code,url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Enlace copiado')}catch(e){toast(url)}
}

/* ================= Vistas ================= */
function cardHtml(i,extra=''){const s=SONGS[i];return `<div class="card ${extra}" style="background:${decColor(s[2])}"><span class="yr" style="color:${decInk(s[2])}">${s[2]}</span><span class="t">${esc(s[0])}</span><span class="a">${esc(s[1])}</span></div>`}
function bigCard(i){const s=SONGS[i];return `<div class="big-card" style="background:${decColor(s[2])}"><span class="yr" style="color:${decInk(s[2])}">${s[2]}</span><span class="t">${esc(s[0])}</span><span class="a">${esc(s[1])}</span></div>`}
function timelineHtml(p,{slots=false,highlight=null}={}){
  const cards=sortCards(p.cards);let h='<div class="timeline">';
  const slot=k=>{
    if(ui.slot===k) return `<button class="ghost-card" data-act="slot" data-k="${k}" style="width:100%"><span class="yr">?</span><span>La canción va aquí</span></button>`;
    const lbl=k===0?(cards.length?`Antes de ${SONGS[cards[0]][2]}`:'Aquí'):k===cards.length?`Después de ${SONGS[cards[k-1]][2]}`:`Entre ${SONGS[cards[k-1]][2]} y ${SONGS[cards[k]][2]}`;
    return `<button class="slot" data-act="slot" data-k="${k}">${lbl}</button>`};
  cards.forEach((c,k)=>{if(slots)h+=slot(k);h+=cardHtml(c,c===highlight?'new':'')});
  if(slots)h+=slot(cards.length);
  return h+'</div>';
}
function statusHtml(){
  if(!role) return '';
  const lbl={connecting:'Conectando…',online:'Sala '+code,lost:'Reconectando…',idle:''}[net];
  return `<span class="status"><span class="dot ${net==='online'?'on':net==='lost'?'off':''}"></span>${esc(lbl)}</span>`;
}
function scoreboard(){
  return `<div class="chips">${state.players.map((p,i)=>`<span class="chip ${state.status==='playing'&&i===state.turn?'on':''} ${p.id===myId?'me':''}">${esc(p.name)}${p.id===myId?' (tú)':''} <span class="n">${p.cards.length}/${state.target}</span></span>`).join('')}</div>`;
}
function legend(){return `<div class="legend">${Object.keys(DECADES).map(d=>`<span style="background:${DECADES[d][0]}">${String(d).slice(2)}s</span>`).join('')}</div>`}

function vHome(){
  const resume=lsGet('aa.hostState');
  return `
  <div class="panel">
    <h2>¿En qué año sonó esta canción?</h2>
    <p class="muted">Suena una canción y quien tiene el turno la coloca en su línea de tiempo, sin ver el título. Si el año cae en el lugar correcto, se queda la carta. Gana quien junte primero las cartas de la meta.</p>
    ${legend()}
  </div>
  <div class="panel">
    <label class="eyebrow" for="name">Tu nombre</label>
    <input id="name" maxlength="20" autocomplete="nickname" placeholder="Cómo te verán los demás" value="${esc(myName)}">
  </div>
  <div class="panel">
    <span class="eyebrow">Unirme a una sala</span>
    <input id="joincode" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(ui.joinCode)}" aria-label="Código de sala">
    <button class="btn-primary" data-act="join">Entrar</button>
  </div>
  <div class="panel">
    <span class="eyebrow">O sé el anfitrión</span>
    <p class="muted small">Tu teléfono crea la sala y la mantiene. Déjalo con la página abierta durante la partida.</p>
    <button class="btn-ghost" data-act="create">Crear sala nueva</button>
    ${resume?`<button class="btn-ghost" data-act="resume">Retomar mi última sala</button>`:''}
  </div>`;
}
function vLobby(){
  const s=state, host=role==='host';
  return `
  <div class="panel" style="text-align:center">
    <span class="eyebrow">Código de la sala</span>
    <div class="code">${esc(code)}</div>
    <button class="btn-primary" data-act="share">Invitar amigos</button>
    <p class="muted small">Tus amigos abren el enlace o entran a esta página y escriben el código.</p>
  </div>
  <div class="panel">
    <span class="eyebrow">Jugadores · ${s.players.length}</span>
    <div class="chips">${s.players.map(p=>`<span class="chip ${p.id===myId?'me':''}">${esc(p.name)}${p.id===s.hostId?' ★':''}${host&&p.id!==myId?` <button class="btn-small" style="min-height:0;padding:0 4px;background:none;color:inherit" data-act="kick" data-id="${p.id}" aria-label="Quitar">×</button>`:''}</span>`).join('')}</div>
    ${host?`
      <div class="row"><label for="target" class="muted" style="flex:1">Cartas para ganar</label><select id="target" style="width:auto">${TARGETS.map(n=>`<option value="${n}" ${s.target===n?'selected':''}>${n}</option>`).join('')}</select></div>
      <button class="btn-primary" data-act="start" ${s.players.length<2?'disabled':''}>${s.players.length<2?'Esperando jugadores…':'Empezar partida'}</button>`
      :`<p class="muted">Meta: ${s.target} cartas. Esperando a que el anfitrión empiece…</p>`}
  </div>
  ${leaveBox()}`;
}
function vPlaying(){
  const s=state, p=s.players[s.turn], mine=p.id===myId, meP=s.players.find(x=>x.id===myId);
  const host=role==='host';
  let main='';
  if(s.phase==='listen'){
    if(mine){
      main=`<div class="panel">
        <span class="eyebrow">Tu turno</span>
        <div class="mystery"><div class="lab"><b>te toca a ti</b><span class="small">lado A · 60 min</span></div><div class="reels"><span class="reel"></span><span class="q">?</span><span class="reel"></span></div><p class="hint">Alguien está poniendo tu canción. Escucha y elige dónde va.</p></div>
        <h2>¿Dónde va en tu línea?</h2>
        ${timelineHtml(p,{slots:true})}
        <button class="btn-primary" data-act="place" ${ui.slot===null?'disabled':''}>${ui.slot===null?'Toca un hueco':'Confirmar aquí'}</button>
      </div>`;
    }else{
      const dj=s.players[(s.turn+1)%s.players.length];
      main=`<div class="panel">
        <span class="eyebrow">Turno de ${esc(p.name)}</span>
        <h2>${dj.id===myId?'Te toca poner la canción':`Pone la canción: ${esc(dj.name)}`}</h2>
        <a class="btn btn-spotify" href="${spotifyUrl(s.current)}" target="_blank" rel="noopener">Abrir en Spotify</a>
        ${ui.showTitle?`<div class="reveal-title"><strong>${esc(SONGS[s.current][0])}</strong><span class="muted">${esc(SONGS[s.current][1])}</span></div>`:''}
        <div class="row"><button class="btn-ghost btn-small" data-act="title">${ui.showTitle?'Ocultar título':'Ver título'}</button><button class="btn-ghost btn-small" data-act="skip">Saltar canción</button></div>
        <p class="muted small">Que ${esc(p.name)} no vea tu pantalla. Si alguien ya está poniendo la canción, no hace falta que tú lo hagas.</p>
      </div>
      ${host?`<details class="panel"><summary>Colocar por ${esc(p.name)} (si se desconectó)</summary>${timelineHtml(p,{slots:true})}<button class="btn-primary" data-act="place" ${ui.slot===null?'disabled':''}>Confirmar por ${esc(p.name)}</button></details>`:''}
      ${meP?`<div class="panel"><span class="eyebrow">Tu línea · ${meP.cards.length}/${s.target}</span>${timelineHtml(meP)}</div>`:''}`;
    }
  }else{
    const r=s.result, rp=s.players.find(x=>x.id===r.playerId)||p;
    main=`<div class="panel">
      <div class="result ${r.correct?'ok':'bad'}">${r.correct?'¡Correcto!':'No era ahí'}</div>
      ${bigCard(r.song)}
      <p style="text-align:center">${r.correct?`${rp.id===myId?'Te quedas':esc(rp.name)+' se queda'} la carta.`:`La carta se descarta.`}</p>
      <button class="btn-primary" data-act="next">Siguiente turno</button>
      <a class="btn btn-ghost" href="${spotifyUrl(r.song)}" target="_blank" rel="noopener">Escucharla otra vez</a>
    </div>
    <div class="panel"><span class="eyebrow">Línea de ${rp.id===myId?'ti':esc(rp.name)}</span>${timelineHtml(rp,{highlight:r.correct?r.song:null})}</div>`;
  }
  return `${scoreboard()}${main}${allLines()}${leaveBox()}`;
}
function vFinished(){
  const w=state.players.find(p=>p.id===state.winner);
  return `<div class="panel" style="text-align:center">
    <span class="eyebrow">Fin de la partida</span>
    <h2 style="font-size:2.6rem">${w&&w.id===myId?'¡Ganaste!':'Gana '+esc(w?w.name:'—')}</h2>
    ${state.result?bigCard(state.result.song):'<p class="muted">Se acabó el mazo.</p>'}
    ${role==='host'?`<button class="btn-primary" data-act="rematch">Revancha</button>`:'<p class="muted">El anfitrión puede empezar la revancha.</p>'}
  </div>${scoreboard()}${allLines(true)}${leaveBox()}`;
}
function allLines(open=false){
  return `<details class="panel" ${open?'open':''}><summary>Ver las líneas de todos</summary>${state.players.map(p=>`<div class="stack" style="margin-top:10px"><span class="eyebrow">${esc(p.name)} · ${p.cards.length}</span>${p.cards.length?timelineHtml(p):'<span class="muted small">Sin cartas</span>'}</div>`).join('')}</details>`;
}
function leaveBox(){
  const warn=role==='host'?'Si sales, la sala se cierra para todos.':'Puedes volver a entrar con el mismo código.';
  return ui.confirmLeave
    ?`<div class="panel"><p>${warn}</p><div class="row"><button class="btn-danger btn-small" data-act="leave-yes">Salir</button><button class="btn-ghost btn-small" data-act="leave-no">Cancelar</button></div></div>`
    :`<div><button class="btn-ghost btn-small" data-act="leave">Salir de la sala</button></div>`;
}
function vWaiting(){
  return `<div class="panel"><span class="eyebrow">Sala ${esc(code)}</span><h2>${net==='lost'?'Buscando la sala…':'Conectando…'}</h2><p class="muted">Asegúrate de que el anfitrión tenga la página abierta. Si tarda mucho, prueben todos con el mismo wifi.</p></div>${leaveBox()}`;
}

function render(){
  const app=document.getElementById('app');
  const ae=document.activeElement, fid=ae&&ae.id, sel=ae&&ae.selectionStart;
  const nameVal=document.getElementById('name')?.value; if(nameVal!=null){myName=nameVal}
  const jc=document.getElementById('joincode')?.value; if(jc!=null)ui.joinCode=jc;
  let body;
  if(!role) body=vHome();
  else if(!state) body=vWaiting();
  else if(state.status==='lobby') body=vLobby();
  else if(state.status==='playing') body=vPlaying();
  else body=vFinished();
  app.innerHTML=`<header><h1>Gin Tonic</h1>${statusHtml()}</header>${body}`;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}

function needName(){
  const v=(document.getElementById('name')?.value||myName).trim().slice(0,20);
  if(!v){toast('Escribe tu nombre primero');document.getElementById('name')?.focus();return false}
  myName=v;lsSet('aa.name',v);return true;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='create'){if(needName())createRoom()}
  else if(a==='resume'){if(needName()){try{createRoom(JSON.parse(lsGet('aa.hostState')))}catch(err){createRoom()}}}
  else if(a==='join'){if(needName())joinRoom(document.getElementById('joincode').value)}
  else if(a==='share') share();
  else if(a==='kick') act('kick',{id:b.dataset.id});
  else if(a==='start') act('start');
  else if(a==='slot'){const k=+b.dataset.k;ui.slot=ui.slot===k?null:k;render()}
  else if(a==='place'&&ui.slot!==null){act('place',{slot:ui.slot})}
  else if(a==='title'){ui.showTitle=!ui.showTitle;render()}
  else if(a==='skip'){act('skip');toast('Canción cambiada')}
  else if(a==='next') act('next');
  else if(a==='rematch') act('rematch');
  else if(a==='leave'){ui.confirmLeave=true;render()}
  else if(a==='leave-no'){ui.confirmLeave=false;render()}
  else if(a==='leave-yes') leave();
});
document.addEventListener('change',e=>{if(e.target.id==='target')act('target',{n:+e.target.value})});
document.addEventListener('input',e=>{if(e.target.id==='joincode'){const v=e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);if(v!==e.target.value)e.target.value=v}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='joincode'){e.preventDefault();if(needName())joinRoom(e.target.value)}});
// Al volver a la pestaña, el guest reintenta si se cayó la conexión
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&role==='guest'&&(!hostConn||!hostConn.open)&&peer&&!peer.destroyed){if(peer.disconnected){try{peer.reconnect()}catch(e){}}else connectToHost()}});

(function boot(){
  if(typeof Peer==='undefined'){document.getElementById('app').innerHTML='<div class="panel"><h2>No se pudo cargar</h2><p class="muted">Revisa tu conexión a internet y recarga la página.</p></div>';return}
  const q=new URLSearchParams(location.search).get('sala');
  const savedRole=lsGet('aa.role'), savedCode=lsGet('aa.code');
  if(q){ui.joinCode=q.toUpperCase().slice(0,4)}
  if(savedRole==='host'&&lsGet('aa.hostState')&&myName&&(!q||q.toUpperCase()===savedCode)){try{createRoom(JSON.parse(lsGet('aa.hostState')));return}catch(e){}}
  if(savedRole==='guest'&&savedCode&&myName&&(!q||q.toUpperCase()===savedCode)){joinRoom(savedCode);return}
  render();
})();
</script>
</body>
</html>
